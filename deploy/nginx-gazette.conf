# /etc/nginx/sites-available/gazette  — servi sur le réseau local / VPN uniquement
server {
    listen 80;
    server_name gazette.lan;

    root /opt/gazette/out;
    index index.html;

    # Réseau local et VPN seulement (adapter aux plages utilisées)
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 100.64.0.0/10;   # Tailscale
    deny all;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'self'";

    # Bouton « Actualiser » -> service local (gazette-web.service)
    location = /actualiser {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
